trigger:
  branches:
    include:
      - main

# schedules:
#   - cron: '*/5 * * * *'
#     displayName: 'Run every 5 minutes'
#     branches:
#       include:
#         - main
#     always: true

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: Playwright
    displayName: 'Playwright tests'
    strategy:
      maxParallel: 2
      matrix:
        Functional:
          suite: 'functional'
          testSuiteId: '3203'
          expectedTestCount: '9'
          junitPath: 'test-results/junit.xml'
          reportPath: 'playwright-report'
          resultsPath: 'test-results'
        Accessibility:
          suite: 'accessibility'
          testSuiteId: '3204'
          expectedTestCount: '3'
          junitPath: 'test-results/accessibility/junit.xml'
          reportPath: 'playwright-report/accessibility'
          resultsPath: 'test-results/accessibility'
    steps:
      - task: UseNode@1
        inputs:
          version: '20.x'
        displayName: 'Install Node.js'

      - script: npm install
        workingDirectory: 'playwright-tests'
        displayName: 'Install test dependencies'

      - script: npx playwright install --with-deps chromium
        workingDirectory: 'playwright-tests'
        displayName: 'Install Chromium and system dependencies'

      - script: npm run test:$(suite)
        workingDirectory: 'playwright-tests'
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: 'never'
          PLAYWRIGHT_SCREENSHOT: 'on'
        displayName: 'Run $(suite) tests'

      - task: PowerShell@2
        condition: succeededOrFailed()
        inputs:
          pwsh: true
          targetType: 'inline'
          script: >-
            & './scripts/publish-test-plan-results.ps1'
            -Suite '$(suite)' -PlanId 3201 -SuiteId $(testSuiteId)
            -ExpectedCount $(expectedTestCount) -JunitPath 'playwright-tests/$(junitPath)'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        displayName: 'Publish $(suite) results to Test Plan 3201'

      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: 'playwright-tests/$(reportPath)'
          artifact: 'playwright-report-$(suite)'
        displayName: 'Publish $(suite) HTML report'

      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: 'playwright-tests/$(resultsPath)'
          artifact: 'test-results-$(suite)'
        displayName: 'Publish $(suite) screenshots and traces'
