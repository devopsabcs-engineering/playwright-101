name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Playwright ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: functional
            junitPath: test-results/junit.xml
            reportPath: playwright-report
            resultsPath: test-results
          - suite: accessibility
            junitPath: test-results/accessibility/junit.xml
            reportPath: playwright-report/accessibility
            resultsPath: test-results/accessibility
    defaults:
      run:
        working-directory: playwright-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: 'never'
          PLAYWRIGHT_SCREENSHOT: 'on'
      - name: Summarize ${{ matrix.suite }} test results
        if: always()
        run: node scripts/summarize-results.mjs
        env:
          JUNIT_PATH: ${{ matrix.junitPath }}
      - name: Upload ${{ matrix.suite }} HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-tests/${{ matrix.reportPath }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload ${{ matrix.suite }} screenshots, traces, and JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite }}
          path: playwright-tests/${{ matrix.resultsPath }}/
          if-no-files-found: error
          retention-days: 30
